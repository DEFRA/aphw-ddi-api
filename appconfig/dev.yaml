---
environment: production
environmentCode: dev
container:
  authServerUrl: https://oidc.integration.account.gov.uk
  messageQueueHost: DEVFFCINFSB1001.servicebus.windows.net
  osPlacesBaseUrl: https://api.os.uk/search/places/v1
  policeApiBaseUrl: https://data.police.uk/api
  redisHostname: DEVFFCINFRD1001.redis.cache.windows.net
  redisPort: 6380
  eventsTopicAddress: aphw-ddi-events
  notificationsTopicAddress: aphw-ddi-notifications
  certificateRequestQueue: aphw-ddi-certificate-request
  ddiDocumentsBaseUrl: http://aphw-ddi-documents.aphw-ddi-dev
  enforcementUrl: https://aphw-ddi-enforcement-dev.azure.defra.cloud/
ingress:
  server: azure.defra.cloud
  endpoint: aphw-ddi-api-dev
secretProviderClass:
  azure:
    keyvaultName: DEVFFCINFKV1001
    objects:
      - objectName: devtest-ffcahwr-appInsights-connectionString
        objectType: secret
      - objectName: DEV-aphw-ddi-os-places-key
        objectType: secret
      - objectName: DEV-aphw-ddi-portal-jwt-public-key-2
        objectType: secret
      - objectName: DEV-aphw-ddi-enforcement-jwt-public-key
        objectType: secret
      - objectName: DEV-aphw-ddi-api-jwt-public-key
        objectType: secret
      - objectName: DEV-aphw-ddi-api-jwt-private-key
        objectType: secret
      - objectName: dev-redisPassword
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-api
      type: Opaque
      data:
        - objectName: devtest-ffcahwr-appInsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: DEV-aphw-ddi-os-places-key
          key: OS_PLACES_API_KEY
        - objectName: DEV-aphw-ddi-portal-jwt-public-key-2
          key: PORTAL_PUBLIC_KEY
        - objectName: DEV-aphw-ddi-enforcement-jwt-public-key
          key: ENFORCEMENT_PUBLIC_KEY
        - objectName: DEV-aphw-ddi-api-jwt-public-key
          key: API_PUBLIC_KEY
        - objectName: DEV-aphw-ddi-api-jwt-private-key
          key: API_PRIVATE_KEY
        - objectName: dev-redisPassword
          key: REDIS_PASSWORD
